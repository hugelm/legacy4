services:
  frontend:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - /var/app/current/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - /var/app/current/frontend/index.html:/usr/share/nginx/html/index.html
    depends_on:
      - backend

  backend:
    image: python:3.10-slim
    command: >
      sh -c "pip install --no-cache-dir -r /app/requirements.txt && python /app/main.py"
    ports:
      - "8080:8080"
    volumes:
      - /var/app/current/backend:/app
    environment:
      - DB_HOST=db
      - DB_USER=legacy_user
      - DB_PASSWORD=legacy_pass
      - DB_NAME=legacyhub
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: legacy4-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: legacyhub
      MYSQL_USER: legacy_user
      MYSQL_PASSWORD: legacy_pass
    volumes:
      - legacy4-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -proot_pass || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  legacy4-db-data:
