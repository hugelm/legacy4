services:
  frontend:
    image: nginx:stable
    ports: ["80:80"]
    volumes:
      - /var/app/current/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - /var/app/current/frontend:/usr/share/nginx/html
    environment:
      - TZ=Europe/Berlin
    depends_on: [backend]
  backend:
    image: python:3.10-slim
    command: sh -c "pip install -r /app/requirements.txt && python /app/main.py"
    ports: ["8080:8080"]
    volumes: ["/var/app/current/backend:/app"]
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - TZ=Europe/Berlin
    depends_on:
      db: {condition: service_healthy}
  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - TZ=Europe/Berlin
    volumes: ["legacy4-db-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p${DB_ROOT_PASSWORD} || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes: {legacy4-db-data: }
