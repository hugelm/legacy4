version: '3.8'

services:
  nginx-frontend:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/index.html:/usr/share/nginx/html/index.html
    depends_on:
      - backend

  backend:
    image: python:3.10-slim
    command: ["python", "/app/receiver.py"]
    ports:
      - "8080:8080"
    volumes:
      - ./backend/receiver.py:/app/receiver.py