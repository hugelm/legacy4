services:
  frontend:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - /var/app/current/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - /var/app/current/frontend/index.html:/usr/share/nginx/html/index.html
    depends_on:
      - backend

  backend:
    image: python:3.10-slim
    command: ["python", "/app/receiver.py"]
    ports:
      - "8080:8080"
    volumes:
      - /var/app/current/backend:/app