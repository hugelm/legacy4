services:
  frontend:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - /var/app/current/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - /var/app/current/frontend/index.html:/usr/share/nginx/html/index.html
      # for testing V2
      - /var/app/current/frontend/index2.html:/usr/share/nginx/html/index2.html
      # V3 - Dynamic Dashboard
      - /var/app/current/frontend/index3.html:/usr/share/nginx/html/index3.html
    depends_on:
      - backend
      # for testing V2
      - backend2
      # V3
      - backend3

  backend:
    image: python:3.10-slim
    command: ["python", "/app/receiver.py"]
    ports:
      - "8080:8080"
    volumes:
      - /var/app/current/backend:/app

  # for testing V2
  backend2:
    image: python:3.10-slim
    command: ["python", "/app/receiver2.py"]
    ports:
      - "8081:8081"
    volumes:
      - /var/app/current/backend:/app

  # V3 - Dynamic Dashboard with SQLite
  backend3:
    image: python:3.10-slim
    command: ["python", "/app/receiver3.py"]
    ports:
      - "8082:8082"
    volumes:
      - /var/app/current/backend:/app
      - legacy4-db:/app/data

volumes:
  legacy4-db: